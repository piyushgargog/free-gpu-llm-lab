name: Bug report
description: Something in the code, scripts, or docs is broken or incorrect.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For undisclosed security
        vulnerabilities, use [private reporting](https://github.com/piyushgargog/free-gpu-llm-lab/security) instead of this form.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, and whether this is local-only or requires Colab/Kaggle.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where does this happen?
      options:
        - Local machine (no GPU/model code)
        - Remote GPU (Colab)
        - Remote GPU (Kaggle)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output/logs
      render: shell
    validations:
      required: false
