name: CI

# Lightweight local checks only. This workflow NEVER downloads model
# weights, requires a GPU, or runs LLM inference — see docs/colab.md for
# why: real experiments only happen in Colab/Kaggle, never in CI.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight dependencies only
        run: pip install -e ".[dev]"

      - name: Compile check (syntax only, no imports of GPU-only modules)
        run: python -m compileall -q src experiments scripts app tests

      - name: Run lightweight unit tests (no GPU, no model weights)
        run: pytest tests/ -v
